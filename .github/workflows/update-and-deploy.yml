name: Update data & deploy

on:
  schedule:
    - cron: "17 19 * * *"   # 04:17 KST daily (19:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data from Korea Tourism Organization API
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python -u scripts/fetch.py  # -u: stream log lines while it runs

      - name: Commit data if changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update tourism data ($(TZ=Asia/Seoul date +%F))"
            # main may have moved (an earlier run's data commit or a new push). Rebase onto
            # it, keeping this run's freshly generated data if both touched data/.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll assets data _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
